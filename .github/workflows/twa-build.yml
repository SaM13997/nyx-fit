name: Build Android TWA

on:
  workflow_dispatch:
  push:
    branches: [dev, master]
    paths:
      - 'builds/**'
      - 'scripts/build-twa.sh'
      - 'scripts/sync-assetlinks.mjs'
      - '.github/workflows/twa-build.yml'

permissions:
  contents: read

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Digital Asset Links
        run: node scripts/sync-assetlinks.mjs

      - name: Decode Android keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_BASE64 secret is not configured — TWA build skipped."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > builds/android.keystore
          echo "configured=true" >> "$GITHUB_OUTPUT"
          ls -lh builds/android.keystore

      - name: Build signed APK and AAB
        if: steps.keystore.outputs.configured == 'true'
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x scripts/build-twa.sh
          ./scripts/build-twa.sh

      - name: Upload TWA artifacts
        if: steps.keystore.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nyx-fit-twa-${{ github.sha }}
          path: |
            builds/app-release-signed.apk
            builds/app-release-bundle.aab
          retention-days: 30
          if-no-files-found: warn
