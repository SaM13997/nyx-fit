name: Build Android TWA

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'builds/**'
      - 'public/.well-known/**'
      - 'public/assetlinks.json'
      - 'scripts/build-twa.sh'
      - 'scripts/verify-assetlinks.mjs'
      - '.github/workflows/twa-build.yml'

concurrency:
  group: twa-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Check TWA secrets
        id: secrets
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$TWA_KEYSTORE_BASE64" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TWA_KEYSTORE_BASE64 not set — skipping signed build. See docs/android-twa-signing.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.secrets.outputs.configured == 'true'
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
        run: echo "$TWA_KEYSTORE_BASE64" | base64 -d > builds/android.keystore

      - name: Verify Digital Asset Links fingerprint
        if: steps.secrets.outputs.configured == 'true'
        env:
          TWA_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          TWA_KEY_ALIAS: ${{ secrets.TWA_KEY_ALIAS }}
        run: node scripts/verify-assetlinks.mjs

      - name: Build signed TWA bundle
        if: steps.secrets.outputs.configured == 'true'
        env:
          TWA_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          TWA_KEY_ALIAS: ${{ secrets.TWA_KEY_ALIAS }}
        run: chmod +x scripts/build-twa.sh && ./scripts/build-twa.sh

      - name: Upload release artifacts
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nyx-fit-twa-release
          path: |
            builds/app-release-bundle.aab
            builds/app-release-signed.apk
          if-no-files-found: error

      - name: Validate workflow (no secrets)
        if: steps.secrets.outputs.configured != 'true'
        run: |
          test -f builds/twa-manifest.json
          test -f public/.well-known/assetlinks.json
          test -f scripts/build-twa.sh
          test -f docs/android-twa-signing.md
          echo "TWA workflow files validated. Add TWA_KEYSTORE_* secrets to produce signed builds."
