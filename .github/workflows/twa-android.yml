name: Build Android TWA

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'builds/**'
      - '.github/workflows/twa-android.yml'
      - 'public/.well-known/assetlinks.json'
      - 'public/assetlinks.json'

jobs:
  build:
    name: Bubblewrap signed AAB
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.TWA_CI_ENABLED == 'true')
    env:
      TWA_KEY_ALIAS: android
      TWA_KEYSTORE_PATH: builds/android.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "$TWA_KEYSTORE_BASE64" || { echo "::error::Missing secret TWA_KEYSTORE_BASE64"; exit 1; }
          test -n "$TWA_KEYSTORE_PASSWORD" || { echo "::error::Missing secret TWA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$TWA_KEY_PASSWORD" || { echo "::error::Missing secret TWA_KEY_PASSWORD"; exit 1; }
          test -n "$TWA_SHA256_FINGERPRINT" || { echo "::error::Missing secret TWA_SHA256_FINGERPRINT"; exit 1; }
          echo "All TWA secrets present."
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          TWA_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          TWA_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
          TWA_SHA256_FINGERPRINT: ${{ secrets.TWA_SHA256_FINGERPRINT }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Decode signing keystore
        run: echo "$TWA_KEYSTORE_BASE64" | base64 -d > builds/android.keystore
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}

      - name: Verify asset links fingerprint
        run: npm run twa:validate-assetlinks
        env:
          TWA_SHA256_FINGERPRINT: ${{ secrets.TWA_SHA256_FINGERPRINT }}

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build signed TWA bundle
        working-directory: builds
        run: |
          bubblewrap update --manifest twa-manifest.json
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath android.keystore \
            --signingKeyAlias "$TWA_KEY_ALIAS" \
            --signingKeyPassword "$TWA_KEY_PASSWORD"
        env:
          TWA_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          TWA_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: nyx-fit-twa-release
          path: |
            builds/app-release-bundle.aab
            builds/app-release-signed.apk
          if-no-files-found: error
